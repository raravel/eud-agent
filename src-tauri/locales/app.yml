_version: 2

# User-facing Rust text. Keys are grouped by module; every key carries both languages.
# Terms follow panel/src/locales/GLOSSARY.md.

tray.open:
  ko: 창 열기
  en: Open window
tray.quit:
  ko: 종료
  en: Quit
tray.status:
  ko: "원격 접속: 켜짐 · %{target}"
  en: "Remote access: on · %{target}"
tray.quit_title:
  ko: 종료할까요?
  en: Quit eud-agent?
tray.quit_body:
  ko: "그래도 종료하면 진행 중인 작업을 중단합니다. 대화와 검토 대기 중인 계획은 프로젝트를 다시 열면 그대로 남아 있습니다."
  en: "Quitting stops the work in progress. Conversations and plans waiting for review are still there when you open the project again."
common.cancel:
  ko: 취소
  en: Cancel
map_test.unsupported:
  ko: 맵 실행 테스트는 Windows에서만 쓸 수 있습니다.
  en: Map runtime tests are available on Windows only.
map_test.install_running:
  ko: 맵 실행 테스트 파일을 내려받는 중입니다. 끝난 뒤 다시 시도하세요.
  en: The map runtime test files are downloading. Try again when it finishes.
map_test.install_failed:
  ko: "맵 실행 테스트 파일을 받지 못해 꺼 두었습니다. 네트워크를 확인하고 다시 켜세요: %{error}"
  en: "Could not download the map runtime test files, so map tests stay off. Check the network and turn them on again: %{error}"
map_test.remove_failed:
  ko: "맵 실행 테스트 파일을 지우지 못했습니다. 실행 중인 테스트가 끝난 뒤 다시 시도하세요: %{error}"
  en: "Could not delete the map runtime test files. Try again after the running test finishes: %{error}"
