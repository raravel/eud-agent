name: Publish App Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching the committed app version, for example v1.0.0."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: app-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # The tag, the three committed versions and the managed FFmpeg pins are one
  # check that does not depend on the platform, so it runs once on the cheapest
  # runner and no build starts until it passes.
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify release version and managed audio pins
        id: release
        run: node .github/scripts/verify-release.mjs "$RELEASE_TAG"

  publish:
    needs: verify
    strategy:
      # Every platform builds at once, so the release costs one build's
      # wall-clock rather than three. The one thing the jobs share is
      # `latest.json`, which tauri-action merges by reading the release's
      # existing asset before writing its own entry; the verify-updater job
      # below is what catches the rare interleave that drops a platform.
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            rust-targets: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust-targets: aarch64-apple-darwin
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Install panel dependencies
        run: npm ci --prefix panel

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # The native ISOM engine is built by MSBuild on Windows and by clang
          # on macOS, per architecture: one cache per build, never shared.
          key: ${{ matrix.platform }}-${{ matrix.rust-targets }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build, sign, and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          EUD_ANTIGRAVITY_OAUTH_CLIENT_ID: ${{ vars.EUD_ANTIGRAVITY_OAUTH_CLIENT_ID }}
          EUD_ANTIGRAVITY_OAUTH_CLIENT_SECRET: ${{ secrets.EUD_ANTIGRAVITY_OAUTH_CLIENT_SECRET }}
        with:
          tauriScript: cargo tauri
          args: ${{ matrix.args }}
          tagName: ${{ needs.verify.outputs.tag }}
          releaseName: "v__VERSION__"
          releaseBody: |
            네이티브 EUD 맵 저작 앱의 첫 정식 릴리스입니다. EUD Editor 3 런타임 의존을 걷어내고
            `.eap` 매니페스트 · `src/**` · sparse DAT를 유일한 권위로 삼는 독립 euddraft 런타임으로
            동작합니다. 맵 에이전트(ISOM 브러시 · 두다드 · 사운드 · 후보 맵 Apply/Undo), 설치된
            스타크래프트에서 직접 그림을 읽어 보여주는 DAT 위키, 프로젝트 루트 git 기반 되돌리기,
            5개 provider 런타임, 헤더에서 직접 실행하는 프로젝트 빌드를 포함합니다.

            이번 릴리스부터 macOS(Apple Silicon) 빌드를 함께 제공합니다. Intel 맥은 RAG가 쓰는
            ONNX Runtime이 그 타깃용 바이너리를 제공하지 않아 빌드 대상이 아닙니다. macOS 빌드는
            Apple 개발자 서명이 없어 첫 실행 시 Gatekeeper가 차단하므로, 앱을 우클릭한 뒤 "열기"를
            선택하거나 `xattr -dr com.apple.quarantine /Applications/eud-agent.app`을 실행해 주세요.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          retryAttempts: 1

  # The publish jobs each rewrite `latest.json`. Read it back once they are all
  # done and fail loudly if a platform is missing, instead of shipping a release
  # that quietly never offers those users an update.
  verify-updater:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the published updater manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$RELEASE_TAG" --pattern latest.json --dir . --clobber

      - name: Verify every platform reached the updater manifest
        run: node .github/scripts/verify-updater-json.mjs latest.json "${{ needs.verify.outputs.version }}"
