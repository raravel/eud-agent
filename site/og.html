<!doctype html>
<!-- Open Graph card template. `npm run og` renders it to ../docs/assets/og.png
     at 1200x630; it is never published itself. -->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Pretendard Variable";
        font-weight: 45 920;
        src: url("../docs/assets/fonts/PretendardVariable.woff2") format("woff2-variations");
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; }
      body {
        position: relative;
        overflow: hidden;
        font-family: "Pretendard Variable", sans-serif;
        color: #f1f5f9;
        background: #0b1120;
        word-break: keep-all;
      }
      .glow {
        position: absolute; inset: 0;
        background:
          radial-gradient(40% 60% at 15% 10%, rgba(56, 189, 248, 0.18), transparent 70%),
          radial-gradient(40% 55% at 95% 100%, rgba(52, 211, 153, 0.16), transparent 70%);
      }
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(148, 163, 184, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148, 163, 184, 0.07) 1px, transparent 1px);
        background-size: 48px 48px;
        -webkit-mask-image: radial-gradient(ellipse at 30% 40%, #000 25%, transparent 75%);
      }
      .left { position: absolute; left: 72px; top: 72px; width: 520px; }
      .brand { display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 700; }
      .brand img { width: 64px; height: 64px; border-radius: 14px; }
      h1 { margin-top: 40px; font-size: 64px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; }
      h1 span {
        background: linear-gradient(90deg, #7dd3fc, #67e8f9, #6ee7b7);
        -webkit-background-clip: text; color: transparent;
      }
      .sub { margin-top: 22px; font-size: 24px; line-height: 1.5; color: #cbd5e1; }
      .meta { position: absolute; left: 72px; bottom: 60px; display: flex; gap: 10px; }
      .pill { padding: 8px 16px; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 999px; font-size: 19px; color: #cbd5e1; background: rgba(255, 255, 255, 0.04); }

      .win {
        position: absolute; left: 650px; top: 108px; width: 490px; height: 414px;
        border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 18px; overflow: hidden;
        background: oklch(0.14 0.012 255);
        box-shadow: 0 40px 90px -20px rgba(0, 0, 0, 0.8);
        font-size: 17px;
      }
      .bar { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 18px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); color: #94a3b8; font-size: 15px; background: rgba(0, 0, 0, 0.2); }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #34d399; }
      .log { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
      .user { align-self: flex-end; max-width: 88%; padding: 12px 15px; border-radius: 12px 12px 4px 12px; background: oklch(0.23 0.012 255); line-height: 1.45; }
      .tool { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; background: rgba(0, 0, 0, 0.2); }
      .tool b { font-family: Consolas, monospace; font-weight: 600; color: #bae6fd; font-size: 16px; }
      .tool i { font-style: normal; font-family: Consolas, monospace; color: #94a3b8; font-size: 14px; }
      .tool .ok { color: #34d399; font-weight: 700; }
      .tool em { margin-left: auto; font-style: normal; font-size: 14px; color: #6ee7b7; padding: 3px 9px; border-radius: 999px; background: rgba(52, 211, 153, 0.15); }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>

    <div class="left">
      <div class="brand"><img src="../eud-agent.png" alt="" />eud-agent</div>
      <h1>말로 설명하면,<br /><span>EUD 맵이<br />빌드됩니다</span></h1>
      <p class="sub">epScript · DAT · 지형까지<br />검토하고 되돌릴 수 있는 AI 맵 저작 도구</p>
    </div>
    <div class="meta">
      <span class="pill">Windows · macOS</span>
      <span class="pill">무료</span>
      <span class="pill">AI 제공자 5종</span>
    </div>

    <div class="win">
      <div class="bar"><span class="dot"></span>세션 · 웨이브 추가</div>
      <div class="log">
        <div class="user">게임 시작 10초 뒤에 저글링 12마리를 spawn에 만들어줘</div>
        <div class="tool"><span class="ok">✓</span><b>fs_read</b><i>src/main.eps</i></div>
        <div class="tool"><span class="ok">✓</span><b>search_docs</b><i>CreateUnit</i></div>
        <div class="tool"><span class="ok">✓</span><b>fs_write</b><i>src/wave.eps</i></div>
        <div class="tool"><span class="ok">✓</span><b>build_run</b><em>성공</em></div>
      </div>
    </div>
  </body>
</html>
